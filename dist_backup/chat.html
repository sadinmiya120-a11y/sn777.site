<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sn777 লাইভ সাপোর্ট চ্যাট</title>
  <link rel="preconnect" href="https://tawk.to" crossorigin />
  <link rel="preconnect" href="https://embed.tawk.to" crossorigin />
  <link rel="preconnect" href="https://static-v.tawk.to" crossorigin />
  <link rel="preconnect" href="https://va.tawk.to" crossorigin />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #chat-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }
    #tawk_chat_container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }
    .top-bar {
      height: 52px;
      background: #0f172a;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 20;
    }
    .top-bar .title {
      font-size: 15px;
      font-weight: 700;
      color: #fbbf24;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .top-bar .back-link {
      color: #94a3b8;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      transition: all 0.2s;
    }
    .top-bar .back-link:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }
    .loader-container {
      position: absolute;
      top: 52px;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #0b0f19;
      color: #94a3b8;
      z-index: 10;
      transition: opacity 0.5s ease;
    }
    .spinner {
      border: 4px solid rgba(234, 179, 8, 0.2);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border-left-color: #fbbf24;
      animation: spin 0.9s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loader-text {
      font-size: 14px;
      color: #e2e8f0;
      margin-bottom: 4px;
      font-weight: 600;
    }
    .loader-subtext {
      font-size: 12px;
      color: #64748b;
    }
  </style>
  <script type="text/javascript">
    window.addEventListener("error", function(e) {
      if (e && e.message && (e.message.indexOf("Tawk") !== -1 || e.message.indexOf("tawk") !== -1)) {
        e.preventDefault();
        return true;
      }
    });

    var urlParams = new URLSearchParams(window.location.search);
    var vName = urlParams.get("name") || "Guest";
    var vEmail = urlParams.get("email") || "guest@sn777.top";
    var vPhone = urlParams.get("phone") || "";
    var vBal = urlParams.get("balance") || "0.00";

    try {
      if (vName === "Guest") {
        var u = localStorage.getItem("sn777_username");
        if (u && u !== "null" && u !== "undefined") vName = u;
      }
    } catch(e) {}

    window.Tawk_API = window.Tawk_API || {};
    window.Tawk_LoadStart = new Date();

    window.Tawk_API.visitor = {
      name: vName,
      email: vEmail
    };

    window.Tawk_API.embedded = "tawk_chat_container";

    window.Tawk_API.onLoad = function() {
      try {
        if (typeof window.Tawk_API.setAttributes === "function") {
          window.Tawk_API.setAttributes({
            name: vName,
            username: vName,
            email: vEmail,
            phone: vPhone,
            balance: vBal,
            userId: vName
          }, function() {});
        }
      } catch(e) {}

      var loader = document.getElementById("loader");
      if (loader) {
        loader.style.opacity = "0";
        setTimeout(function() { loader.style.display = "none"; }, 500);
      }
    };

    setTimeout(function() {
      var loader = document.getElementById("loader");
      if (loader && loader.style.display !== "none") {
        loader.style.opacity = "0";
        setTimeout(function() { loader.style.display = "none"; }, 500);
      }
    }, 6000);

    (function() {
      var s1 = document.createElement("script"), s0 = document.getElementsByTagName("script")[0];
      s1.async = true;
      s1.src = "https://embed.tawk.to/6a00124c06a7a01c3394a833/default";
      s1.charset = "UTF-8";
      s1.setAttribute("crossorigin", "*");
      if (s0 && s0.parentNode) {
        s0.parentNode.insertBefore(s1, s0);
      } else {
        document.head.appendChild(s1);
      }
    })();
  </script>
</head>
<body>
  <div class="top-bar">
    <div class="title">
      <span>💬</span>
      <span>Sn777 লাইভ সাপোর্ট</span>
    </div>
    <a href="/" class="back-link">← গেমে ফিরে যান</a>
  </div>
  <div class="loader-container" id="loader">
    <div class="spinner"></div>
    <div class="loader-text">২৪/৭ লাইভ সাপোর্ট কানেক্ট হচ্ছে...</div>
    <div class="loader-subtext">অনুগ্রহ করে কয়েক সেকেন্ড অপেক্ষা করুন</div>
  </div>
  <div id="chat-wrapper">
    <div id="tawk_chat_container"></div>
  </div>
</body>
</html>
