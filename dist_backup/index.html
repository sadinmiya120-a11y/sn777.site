    <script type="text/javascript">
      (function() {
        function isFiltered(arg) {
          if (!arg) return false;
          var s = "";
          try {
            if (typeof arg === "string") s = arg;
            else if (arg && arg.message) s = arg.message;
            else if (arg && arg.toString) s = arg.toString();

          return /tawk/i.test(s) || /logger/i.test(s) || /error report sent/i.test(s) || /socket on error/i.test(s) || /transport/i.test(s);
        }

        function shouldSuppress(args) {
          try {
            for (var i = 0; i < args.length; i++) {
              if (isFiltered(args[i])) return true;
            }
          } catch(e) {}
          return false;
        }

        var _err = console.error;
        var _warn = console.warn;
        var _log = console.log;
        var _info = console.info;
        var _debug = console.debug;

        console.error = function() {
          if (shouldSuppress(arguments)) return;
          return _err.apply(console, arguments);
        };
        console.warn = function() {
          if (shouldSuppress(arguments)) return;
          return _warn.apply(console, arguments);
        };
        console.log = function() {
          if (shouldSuppress(arguments)) return;
          return _log.apply(console, arguments);

          return _info.apply(console, arguments);
        };
        console.debug = function() {
          if (shouldSuppress(arguments)) return;
          return _debug.apply(console, arguments);
        };

        window.addEventListener("error", function(e) {
          if (e && (isFiltered(e.message) || isFiltered(e.filename) || isFiltered(e.error))) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopPropagation) e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener("unhandledrejection", function(e) {
          if (e && (isFiltered(e.reason) || isFiltered(e.message))) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopPropagation) e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);
      })();
