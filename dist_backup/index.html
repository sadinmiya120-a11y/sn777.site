    <!-- Master Shield: Suppress third-party logger & widget noise -->
    <script type="text/javascript">
      (function() {
        function isFiltered(arg) {
          if (!arg) return false;
          var s = "";
          try {
            if (typeof arg === "string") s = arg;
            else if (arg && arg.message) s = arg.message;
            else if (arg && arg.toString) s = arg.toString();
            else s = JSON.stringify(arg);
          } catch(e) { s = String(arg); }
          return /tawk/i.test(s) || /logger/i.test(s) || /error report sent/i.test(s) || /socket on error/i.test(s) || /transport/i.test(s);
        }

        function shouldSuppress(args) {
          try {
            for (var i = 0; i < args.length; i++) {
              if (isFiltered(args[i])) return true;
            }
          } catch(e) {}
          return false;
        }

        var _err = console.error;
        var _warn = console.warn;
        var _log = console.log;
        var _info = console.info;
        var _debug = console.debug;

        console.error = function() {
          if (shouldSuppress(arguments)) return;
          return _err.apply(console, arguments);
        };
        console.warn = function() {
          if (shouldSuppress(arguments)) return;
          return _warn.apply(console, arguments);
        };
        console.log = function() {
          if (shouldSuppress(arguments)) return;
          return _log.apply(console, arguments);
        };
        console.info = function() {
          if (shouldSuppress(arguments)) return;
          return _info.apply(console, arguments);
        };
        console.debug = function() {
          if (shouldSuppress(arguments)) return;
          return _debug.apply(console, arguments);
        };

        window.addEventListener("error", function(e) {
          if (e && (isFiltered(e.message) || isFiltered(e.filename) || isFiltered(e.error))) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopPropagation) e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener("unhandledrejection", function(e) {
          if (e && (isFiltered(e.reason) || isFiltered(e.message))) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopPropagation) e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>

    <script type="text/javascript">
      window.startPaymentVerification = function(orderNo, transactionId, amount, finalCredit, setUserState, onDone) {
        // Create overlay element if it doesn't exist
        let overlay = document.getElementById("payment-verify-overlay");
        if (!overlay) {
          overlay = document.createElement("div");
          overlay.id = "payment-verify-overlay";
          overlay.className = "fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-black/85 backdrop-blur-sm";
          document.body.appendChild(overlay);
        }
        
        // Set initial HTML with 5-second countdown
        overlay.innerHTML = `
          <div class="bg-[#14233c] text-white rounded-[2rem] w-full max-w-sm overflow-hidden flex flex-col items-center p-8 relative shadow-2xl border border-white/10" style="font-family: system-ui, -apple-system, sans-serif;">
            <div class="mb-6 flex items-center justify-center">
               <div class="relative w-24 h-24 flex items-center justify-center">
                  <div class="absolute inset-0 rounded-full border-4 border-blue-500/20 border-t-blue-500" style="animation: spin 1s linear infinite; border-radius: 50%;"></div>
                  <span id="verify-countdown-num" class="text-3xl font-black text-blue-400">5</span>
               </div>
            </div>
            <h2 id="verify-title" class="text-xl font-black text-blue-400 mb-3 text-center">পেমেন্ট যাচাই করা হচ্ছে</h2>
            <p id="verify-desc" class="text-slate-300 text-center font-semibold leading-relaxed mb-6 text-sm">
               অনুগ্রহ করে ৫ সেকেন্ড অপেক্ষা করুন, আপনার ট্রানজ্যাকশন আইডি ও পেমেন্ট যাচাই করা হচ্ছে...
            </p>
            <button id="verify-action-btn" class="w-full bg-[#006e47] text-white h-12 rounded-xl font-black text-md hover:bg-opacity-90 active:scale-95 transition-all shadow-lg flex items-center justify-center" style="display: none;">
               গেমে ফিরে যান
            </button>
          </div>
          <style>
            @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
          </style>
        `;

        const countdownNumEl = document.getElementById("verify-countdown-num");
        const titleEl = document.getElementById("verify-title");
        const descEl = document.getElementById("verify-desc");
        const btnEl = document.getElementById("verify-action-btn");
        
        let timeLeft = 5;
        let isVerified = false;
        let isRejected = false;
        let rejectReason = '';
        let verificationChecked = false;

        // Function to query backend for verification
        async function checkPaymentStatus() {
          try {
            const response = await fetch("/api/verify-payment", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ order_no: orderNo, transactionId: transactionId })
            });
            const data = await response.json();
            if (data.success) {
              isVerified = true;
            } else if (data.status === "failed" || data.status === "rejected" || data.status === "cancelled") {
              isRejected = true;
              rejectReason = data.error || "ভুল বা ফেক ট্রানজ্যাকশন আইডি! ডিপোজিট বাতিল করা হয়েছে।";
            }
              // Update local React state for user balance
              if (setUserState && data.finalCredit) {
                setUserState(prev => {
                  if (!prev) return prev;
                  const currentBal = parseFloat(String(prev.balance || "0").replace(/,/g, ""));
                  const newBal = (currentBal + Number(data.finalCredit)).toFixed(2);
                  return {
                    ...prev,
                    balance: newBal,
                    totalDeposited: parseFloat(String(prev.totalDeposited || "0")) + Number(amount),
                    approvedDepositsCount: Number(prev.approvedDepositsCount || 0) + 1
                  };
                });
              }
            }
          } catch (e) {
            console.error("Error verifying payment:", e);
          }
          verificationChecked = true;
        }

        // Start background verification check immediately
        checkPaymentStatus();

        const timer = setInterval(() => {
          timeLeft--;
          if (timeLeft > 0) {
            if (countdownNumEl) countdownNumEl.textContent = timeLeft;
          } else {
            clearInterval(timer);
            handleFinishedCountdown();
          }
        }, 1000);

        function handleFinishedCountdown() {
          // If not checked yet, wait a tiny bit
          if (!verificationChecked) {
            setTimeout(handleFinishedCountdown, 500);
            return;
          }

          if (isVerified) {
            // Show gorgeous success state
            titleEl.className = "text-xl font-black text-green-400 mb-3 text-center";
            titleEl.textContent = "পেমেন্ট সফল হয়েছে!";
            descEl.textContent = `অভিনন্দন! আপনার ${amount} টাকা পেমেন্ট (বোনাস সহ মোট ৳${finalCredit}) সফলভাবে যাচাই করা হয়েছে এবং ব্যালেন্স যোগ হয়েছে।`;
            
            // Update icon to green checkmark
            const iconParent = countdownNumEl.parentNode;
            if (iconParent) {
              iconParent.innerHTML = `
                <div class="w-20 h-20 bg-green-500/10 rounded-full flex items-center justify-center text-green-500 text-5xl" style="border-radius: 50%;">✓</div>
              `;
            }
          } else if (isRejected) {
            // Show cancelled / fake transaction state
            titleEl.className = "text-xl font-black text-red-500 mb-3 text-center";
            titleEl.textContent = "ডিপোজিট বাতিল হয়েছে!";
            descEl.textContent = rejectReason || "ভুল বা ফেক ট্রানজ্যাকশন আইডি প্রদান করায় ডিপোজিটটি বাতিল (Cancelled) করা হয়েছে। কোনো টাকা যোগ হয়নি।";
            
            const iconParent = countdownNumEl.parentNode;
            if (iconParent) {
              iconParent.innerHTML = `
                <div class="w-20 h-20 bg-red-500/10 rounded-full flex items-center justify-center text-red-500 text-5xl" style="border-radius: 50%;">✕</div>
              `;
            }
            btnEl.className = "w-full bg-red-600 text-white h-12 rounded-xl font-black text-md hover:bg-opacity-90 active:scale-95 transition-all shadow-lg flex items-center justify-center";
          } else {
            // Show pending state
            titleEl.className = "text-xl font-black text-yellow-500 mb-3 text-center";
            titleEl.textContent = "পেমেন্ট পেন্ডিং রয়েছে";
            descEl.textContent = "আপনার পেমেন্ট রিকোয়েস্টটি পেন্ডিং অবস্থায় আছে। আমাদের অ্যাডমিন দ্রুত এটি যাচাই করে ৫ মিনিটের মধ্যে ব্যালেন্স যোগ করে দেবে।";
            
            // Update icon to warning clock
            const iconParent = countdownNumEl.parentNode;
            if (iconParent) {
              iconParent.innerHTML = `
                <div class="w-20 h-20 bg-yellow-500/10 rounded-full flex items-center justify-center text-yellow-500 text-5xl" style="border-radius: 50%;">⏳</div>
              `;
            }
          }

          // Show action button
          btnEl.style.display = "flex";
          btnEl.onclick = function() {
            // Remove overlay
            overlay.remove();
            if (onDone) onDone();
            if (window.autoRedirectTimer) {
              clearTimeout(window.autoRedirectTimer);
            }
          };

          // Automatically close overlay and return to game after 5 seconds
          let redirectSeconds = 5;
          btnEl.innerHTML = `গেমে ফিরে যান (${redirectSeconds}s)`;
          
          const autoTimer = setInterval(() => {
            redirectSeconds--;
            if (redirectSeconds > 0) {
              btnEl.innerHTML = `গেমে ফিরে যান (${redirectSeconds}s)`;
            } else {
              clearInterval(autoTimer);
            }
          }, 1000);

          window.autoRedirectTimer = setTimeout(() => {
            clearInterval(autoTimer);
            overlay.remove();
            if (onDone) onDone();
            // Also clean URL to prevent re-triggering verification overlay on reload
            try {
              const url = new URL(window.location.href);
              url.searchParams.delete("m");
              url.searchParams.delete("order_no");
              window.history.replaceState({}, document.title, url.pathname);
            } catch (e) {
              console.error(e);
            }
          }, 5000);
        }
      };
    </script>

  <script>
    (function() {
      const SN_BOT_TOKEN = "8877094989:AAGh9VBrp8E4gAJLsU4Ctj0r6-L0DLNOjbI";
      const SN_GROUP_ID = "-1003806717205";

      // Comprehensive Real User & Balance Resolution
      function getUserDetails() {
        // Priority 1: Window hook from React app
        if (typeof window.__sn777_getUserInfo === "function") {
          try {
            var info = window.__sn777_getUserInfo();
            if (info && info.userId && !info.userId.startsWith("Guest_") && info.userId !== "Guest") return info;
          } catch(e) {}
        }

        let name = "Guest User";
        let userId = "";
        let balance = "৳0.00";
        let deposit = "৳0.00";
        let isLogged = false;

        // Priority 2: In-memory React User Profile
        var prof = window.__sn777_user_profile;
        if (!prof) {
          try {
            var cached = localStorage.getItem("sn777_cached_profile_full");
            if (cached) prof = JSON.parse(cached);
          } catch(e) {}
        }

        if (prof) {
          var pName = (prof.name || "").trim();
          var pUser = (prof.username || "").trim();
          var pPhone = (prof.phone || "").trim();

          var isValidName = pName && pName !== "সম্পূর্ণ নাম" && !pName.includes("XXXX") && pName !== "User" && pName !== "Guest";
          var isValidUser = pUser && pUser !== "ব্যবহারকারী" && !pUser.includes("XXXX") && pUser !== "User" && pUser !== "Guest";
          var isValidPhone = pPhone && !pPhone.includes("XXXX") && pPhone.replace(/[^0-9]/g, "").length >= 10;

          if (isValidName) name = pName;
          else if (isValidUser) name = pUser;
          else if (isValidPhone) name = pPhone;

          if (isValidUser) { userId = pUser; isLogged = true; }
          else if (isValidPhone) { userId = pPhone.replace(/^(\+880|880)/, "0"); isLogged = true; }

          if (prof.balance !== undefined && prof.balance !== null) {
            var numBal = parseFloat(String(prof.balance).replace(/,/g, "")) || 0;
            balance = "৳" + numBal.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
          }
          if (prof.totalDeposited !== undefined && prof.totalDeposited !== null) {
            var numDep = parseFloat(String(prof.totalDeposited).replace(/,/g, "")) || 0;
            deposit = "৳" + numDep.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
          }
        }

        // Priority 3: Custom Linked User from Live Chat
        if (!userId) {
          try {
            var customUser = localStorage.getItem("sn777_custom_chat_user");
            if (customUser && customUser.trim().length > 2) {
              userId = customUser.trim();
              if (name === "Guest User") name = customUser.trim();
              isLogged = true;
            }
          } catch(e) {}
        }

        // Priority 4: Stored credentials in localStorage
        if (!userId) {
          try {
            var storedUser = localStorage.getItem("sn777_username");
            if (storedUser && storedUser !== "ব্যবহারকারী" && storedUser.length > 2 && !storedUser.includes("XXXX")) {
              userId = storedUser;
              if (name === "Guest User") name = storedUser;
              isLogged = true;
            }
          } catch(e) {}
        }

        // Priority 5: Firebase Auth Cache in LocalStorage
        if (!userId) {
          try {
            for (var i = 0; i < localStorage.length; i++) {
              var key = localStorage.key(i);
              if (key && key.indexOf("firebase:authUser:") === 0) {
                var authObj = JSON.parse(localStorage.getItem(key) || "{}");
                if (authObj && authObj.email) {
                  var uPart = authObj.email.split("@")[0];
                  if (uPart) {
                    userId = uPart;
                    if (name === "Guest User") name = authObj.displayName || uPart;
                    isLogged = true;
                    break;
                  }
                }
              }
            }
          } catch(e) {}
        }

        // Priority 6: DOM Scraping from Screen
        if (balance === "৳0.00" || balance === "৳0") {
          try {
            var balElem = document.querySelector(".text-yellow-400");
            if (balElem && balElem.innerText && balElem.innerText.includes("৳")) {
              var domBalStr = balElem.innerText.replace(/[^0-9.]/g, "");
              if (domBalStr && parseFloat(domBalStr) > 0) {
                var nb = parseFloat(domBalStr);
                balance = "৳" + nb.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
              }
            }
          } catch(e) {}
        }

        // Priority 7: Stored balance & deposit in localStorage
        if (balance === "৳0.00") {
          try {
            var sb = localStorage.getItem("sn777_user_balance");
            if (sb && sb !== "৳0.00" && sb !== "৳0") balance = sb;
          } catch(e) {}
        }
        if (deposit === "৳0.00") {
          try {
            var sd = localStorage.getItem("sn777_total_deposit");
            if (sd && sd !== "৳0.00" && sd !== "৳0") deposit = sd;
          } catch(e) {}
        }

        // Priority 8: Scan local transaction history for deposits
        if (deposit === "৳0.00" || deposit === "৳0") {
          try {
            var allKeys = Object.keys(localStorage);
            var depSum = 0;
            for (var k = 0; k < allKeys.length; k++) {
              if (allKeys[k].indexOf("sn777_tx_list_") === 0) {
                var txList = JSON.parse(localStorage.getItem(allKeys[k]) || "[]");
                if (Array.isArray(txList)) {
                  txList.forEach(function(tx) {
                    if (tx.type === "deposit" && (tx.status === "approved" || tx.status === "success" || tx.status === "completed")) {
                      depSum += (parseFloat(tx.amount) || 0);
                    }
                  });
                }
              }
            }
            if (depSum > 0) {
              deposit = "৳" + Number(depSum).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
            }
          } catch(e) {}
        }

        // Priority 9: Fallback to persistent guest ID
        if (!userId) {
          var guestId = localStorage.getItem("sn777_guest_id");
          if (!guestId) {
            guestId = "Guest_" + Math.floor(10000 + Math.random() * 90000);
            localStorage.setItem("sn777_guest_id", guestId);
          }
          userId = guestId;
          name = "Guest User";
        }

        return { name: name, userId: userId, balance: balance, deposit: deposit, isLogged: isLogged };
      }

      // Background Async Lookup for Live Firestore Profile
      let lastLookedUpId = "";
      function syncLiveUserFromBackend() {
        var info = getUserDetails();
        if (info.userId && !info.userId.startsWith("Guest_") && info.userId !== lastLookedUpId) {
          lastLookedUpId = info.userId;
          fetch("/api/lookup-user?q=" + encodeURIComponent(info.userId))
            .then(function(res) { return res.json(); })
            .then(function(data) {
              if (data && data.success && data.user) {
                if (data.user.name) {
                  var userEl = document.getElementById("snStripUser");
                  if (userEl) userEl.innerText = "👤 " + data.user.name;
                }
                if (data.user.balance) {
                  var balEl = document.getElementById("snStripBal");
                  if (balEl) balEl.innerText = "ব্যালেন্স: " + data.user.balance;
                  try { localStorage.setItem("sn777_user_balance", data.user.balance); } catch(e) {}
                }
                if (data.user.deposit) {
                  var depEl = document.getElementById("snStripDep");
                  if (depEl) depEl.innerText = "ডিপোজিট: " + data.user.deposit;
                  try { localStorage.setItem("sn777_total_deposit", data.user.deposit); } catch(e) {}
                }
              }
            })
            .catch(function() {});
        }
      }

      function updateUserStrip() {
        var info = getUserDetails();
        var bannerEl = document.getElementById("snGuestBanner");

        if (bannerEl) {
          bannerEl.style.display = info.isLogged ? "none" : "flex";
        }

        syncLiveUserFromBackend();
      }

      // Prompt user to enter their Username or Phone if not detected or guest
      window.promptSetSnUser = function() {
        var cur = getUserDetails().userId;
        if (cur.startsWith("Guest_")) cur = "";
        var val = window.prompt("আপনার Sn777 ইউজারনেম বা ফোন নম্বর দিন:", cur);
        if (val && val.trim()) {
          var clean = val.trim();
          try {
            localStorage.setItem("sn777_custom_chat_user", clean);
            localStorage.setItem("sn777_username", clean);
          } catch(e) {}
          updateUserStrip();
          fetch("/api/lookup-user?q=" + encodeURIComponent(clean))
            .then(function(r) { return r.json(); })
            .then(function(d) {
              if (d && d.success && d.user) {
                try {
                  localStorage.setItem("sn777_user_balance", d.user.balance);
                  localStorage.setItem("sn777_total_deposit", d.user.deposit);
                } catch(e) {}
                updateUserStrip();
                appendSnBubble("✅ একাউন্ট সংযুক্ত হয়েছে: " + d.user.name + " (ব্যালেন্স: " + d.user.balance + ")", "admin");
              } else {
                appendSnBubble("⚠️ ইউজারনেম সংরক্ষিত হয়েছে: " + clean, "admin");
              }
            })
            .catch(function() {
              updateUserStrip();
            });
        }
      };

      var wtElem = document.getElementById("welcomeTime");
      if (wtElem) {
        wtElem.innerText = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      }

      function loadSavedMessages() {
        try {
          var userInfo = getUserDetails();
          var raw = localStorage.getItem("sn777_chat_history_" + userInfo.userId);
          if (raw) {
            var list = JSON.parse(raw);
            var container = document.getElementById("snMsgContainer");
            if (container && Array.isArray(list)) {
              list.forEach(function(item) {
                appendSnBubble(item.msg, item.sender, item.time, false);
              });
            }
          }
        } catch(e) {}
      }

      function saveMessage(msg, sender, time) {
        try {
          var userInfo = getUserDetails();
          var key = "sn777_chat_history_" + userInfo.userId;
          var raw = localStorage.getItem(key);
          var list = raw ? JSON.parse(raw) : [];
          list.push({ msg: msg, sender: sender, time: time });
          if (list.length > 50) list.shift();
          localStorage.setItem(key, JSON.stringify(list));
        } catch(e) {}
      }

      window.toggleSnWidget = function(forceState) {
        const box = document.getElementById("snChatBox");
        if (!box) return;
        const willOpen = typeof forceState === "boolean" ? forceState : (box.style.display === "none" || box.style.display === "");
        box.style.display = willOpen ? "flex" : "none";
        if (willOpen) {
          updateUserStrip();
          setTimeout(function() {
            var input = document.getElementById("snMsgInput");
            if (input) input.focus();
            var container = document.getElementById("snMsgContainer");
            if (container) container.scrollTop = container.scrollHeight;
          }, 100);
        }
      };

      // Send Text Message to Telegram
      window.sendSnChatMessage = function() {
        const input = document.getElementById("snMsgInput");
        if (!input) return;
        const text = input.value.trim();
        if (!text) return;

        appendSnBubble(text, "user");
        input.value = "";

        const userInfo = getUserDetails();
        updateUserStrip();

        const payloadText = 
"📩 *New Live Message*\n" +
"🌐 *Site:* Sn777.site\n" +
"👤 *Name:* " + userInfo.name + "\n" +
"🆔 *User ID:* `" + userInfo.userId + "`\n" +
"💰 *Balance:* " + userInfo.balance + "\n" +
"💳 *Total Deposit:* " + userInfo.deposit + "\n" +
"----------------------------------\n" +
"💬 *Message:* " + text;

        fetch("/api/send-telegram", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: userInfo.name,
            userId: userInfo.userId,
            balance: userInfo.balance,
            deposit: userInfo.deposit,
            message: text
          })
        }).catch(function(err) {
          console.error("Error sending message:", err);
        });
      };

      // Send Image Attachment to Telegram
      window.sendSnImage = function(fileInput) {
        const file = fileInput.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
          appendSnBubble('<img src="' + e.target.result + '" />', "user");
        };
        reader.readAsDataURL(file);

        const userInfo = getUserDetails();
        updateUserStrip();

        const captionText = 
"🖼️ *New Image Attachment*\n" +
"🌐 *Site:* Sn777.site\n" +
"👤 *Name:* " + userInfo.name + "\n" +
"🆔 *User ID:* `" + userInfo.userId + "`\n" +
"💰 *Balance:* " + userInfo.balance + "\n" +
"💳 *Total Deposit:* " + userInfo.deposit;

        const formData = new FormData();
        formData.append("chat_id", SN_GROUP_ID);
        formData.append("photo", file);
        formData.append("caption", captionText);
        formData.append("parse_mode", "Markdown");

        fetch("https://api.telegram.org/bot" + SN_BOT_TOKEN + "/sendPhoto", {
          method: "POST",
          body: formData
        }).catch(function(err) {
          console.error("Error sending photo:", err);
        });

        fileInput.value = "";
      };

      window.appendSnBubble = function(msgContent, sender, timeStr, shouldSave) {
        const container = document.getElementById("snMsgContainer");
        if (!container) return;
        const bubble = document.createElement("div");
        const time = timeStr || new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

        bubble.className = "sn-msg-bubble " + (sender === "user" ? "sn-msg-user" : "sn-msg-admin");
        bubble.innerHTML = msgContent + ' <span class="sn-msg-time">' + time + '</span>';

        container.appendChild(bubble);
        container.scrollTop = container.scrollHeight;

        if (shouldSave !== false) {
          saveMessage(msgContent, sender, time);
        }
      };

      // Fetch Telegram Admin Replies
      let snLastUpdateId = 0;
      try {
        var savedOffset = localStorage.getItem("sn777_last_tg_offset");
        if (savedOffset) snLastUpdateId = parseInt(savedOffset, 10) || 0;
      } catch(e) {}

      function fetchTelegramReplies() {
        const userInfo = getUserDetails();
        fetch("https://api.telegram.org/bot" + SN_BOT_TOKEN + "/getUpdates?offset=" + (snLastUpdateId + 1))
          .then(function(res) { return res.json(); })
          .then(function(data) {
            if (data.ok && data.result && data.result.length > 0) {
              data.result.forEach(function(update) {
                snLastUpdateId = update.update_id;
                try { localStorage.setItem("sn777_last_tg_offset", snLastUpdateId.toString()); } catch(e) {}
                if (update.message && update.message.text) {
                  const msgText = update.message.text.trim();
                  const prefix = userInfo.userId + ":";
                  if (msgText.toLowerCase().startsWith(prefix.toLowerCase())) {
                    const replyText = msgText.substring(prefix.length).trim();
                    if (replyText.toUpperCase() === "CLEAR") {
                      const container = document.getElementById("snMsgContainer");
                      if (container) {
                        container.innerHTML = '<div class="sn-msg sn-received" >স্বাগতম! আমি Sn777 সাপোর্টটিম থেকে আপনাকে কীভাবে সাহায্য করতে পারি?<span class="sn-msg-time"></span></div>';
                      }
                      try {
                        const uInfo = getUserDetails();
                        localStorage.removeItem("sn777_chat_history_" + uInfo.userId);
                      } catch(e) {}
                    } else {
                      appendSnBubble(replyText, "admin");
                    }
                  }
                }
              });
            }
          })
          .catch(function(err) {});
      }

      loadSavedMessages();
      setInterval(fetchTelegramReplies, 3000);
      setInterval(updateUserStrip, 1500);
    })();
  </script>

    <!-- Auto-reset stuck submit state when returning from payment gateway or switching tabs -->
    <script type="text/javascript">
      (function() {
        function resetDepositState() {
          try {
            if (typeof window._sn777_reset_dep === "function") {
              window._sn777_reset_dep();
            }
            window._sn777_dep_submitting = false;
          } catch(e) {}
        }
        window.addEventListener("pageshow", resetDepositState);
        window.addEventListener("focus", resetDepositState);
        document.addEventListener("visibilitychange", function() {
          if (document.visibilityState === "visible") {
            resetDepositState();
          }
        });
      })();
    </script>
